
# ============================================================
# MEDICAL VQA PEFT RESEARCH
# Final experimental configuration: LLaVA-Med + LoRA
# ============================================================

project:
  name: "Medical-VQA-PEFT-Research"
  seed: 42
  device: "auto"

# ------------------------------------------------------------
# PROJECT PATHS
# ------------------------------------------------------------

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  llava_format: "data/processed/llava_format"
  checkpoints: "results/checkpoints"
  metrics: "results/metrics"
  predictions: "results/predictions"
  logs: "results/logs"
  graphs: "results/graphs"

# ------------------------------------------------------------
# DATASETS
# ------------------------------------------------------------

datasets:
  SLAKE:
    enabled: true
    train_file: "slake_train.json"
    validation_file: "slake_validation.json"
    test_file: "slake_test.json"
    image_dir: "data/processed/images/slake"
    evaluation_samples: 500

  VQA_RAD:
    enabled: true
    train_file: "vqa_rad_train.json"
    validation_file: "vqa_rad_validation.json"
    test_file: "vqa_rad_test.json"
    image_dir: "data/processed/images/vqa_rad"
    evaluation_samples: 241

  PathVQA:
    enabled: true
    train_file: "pathvqa_train.json"
    validation_file: "pathvqa_validation.json"
    test_file: "pathvqa_test.json"
    image_dir: "data/processed/images/pathvqa"
    evaluation_samples: 500

# ------------------------------------------------------------
# BASE MODEL
# ------------------------------------------------------------

model:
  model_id: "microsoft/llava-med-v1.5-mistral-7b"
  model_family: "llava"
  architecture: "LlavaForConditionalGeneration"
  processor: "AutoProcessor"

  torch_dtype: "float16"
  device_map: "auto"
  trust_remote_code: false

  max_length: 128
  max_new_tokens: 64

# ------------------------------------------------------------
# TRAINING
# ------------------------------------------------------------

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.01

  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"

  fp16: true
  bf16: false
  gradient_checkpointing: false

# ------------------------------------------------------------
# PEFT — LORA ONLY
# ------------------------------------------------------------

peft:
  method: "lora"

  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"
    bias: "none"
    task_type: "CAUSAL_LM"

# ------------------------------------------------------------
# EVALUATION
# ------------------------------------------------------------

evaluation:
  batch_size: 1
  max_samples: null

  metrics:
    - exact_match
    - accuracy
    - token_f1
    - bleu
    - rouge_l

  save_predictions: true

# ------------------------------------------------------------
# EXPERIMENTS
# ------------------------------------------------------------

experiments:
  method: "lora"

  datasets:
    - "SLAKE"
    - "VQA_RAD"
    - "PathVQA"

  compare_datasets: true
  compare_training_time: true
  compare_memory_usage: true
  compare_trainable_parameters: true
